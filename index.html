<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#23201d" />
    <meta name="description" content="Chơi và luyện tập cờ tướng: chơi với máy, puzzle chiếu hết, tàn cuộc, học luật." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Only the glyphs used on the board, so the font download is tiny. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&text=%E5%B8%A5%E4%BB%95%E7%9B%B8%E5%82%8C%E4%BF%A5%E7%82%AE%E5%85%B5%E5%B0%87%E5%A3%AB%E8%B1%A1%E9%A6%AC%E8%BB%8A%E7%A0%B2%E5%8D%92%E6%A5%9A%E6%B2%B3%E6%BC%A2%E7%95%8C%20&display=swap"
    />
    <title>Cờ Tướng Luyện Tập</title>
    <style>
      body {
        margin: 0;
        background: #23201d;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by the app once it loads. -->
      <p style="font-family: system-ui, sans-serif; color: #aaa29b; text-align: center; margin-top: 40vh">Đang tải…</p>
      <p id="load-hint" hidden style="font-family: system-ui, sans-serif; color: #aaa29b; text-align: center">
        Trang không tải được. Nếu đây là GitHub Pages, hãy chọn Settings → Pages → Source: GitHub Actions.
      </p>
    </div>
    <script>
      setTimeout(function () {
        var hint = document.getElementById('load-hint');
        if (hint) hint.hidden = false;
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
